name: Build Nova Browser Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/firefox-inspired-ui

permissions:
  contents: read

jobs:
  test:
    name: Repository tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'electron-builder completed but no Windows installer was found in dist/' }
          Write-Host "Installer: $($installer.FullName)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Browser-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Browser-Build-Metadata
          path: dist/*.yml
          if-no-files-found: warn
          retention-days: 14
